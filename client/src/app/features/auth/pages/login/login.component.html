<div class="login-page">
  <!-- Split Layout: Left Form Panel + Right Hero Panel -->
  <div class="login-split">

    <!-- LEFT: Form Panel -->
    <div class="form-panel">
      <div class="form-panel-inner">

        <!-- Brand Header with Official Logo -->
        <div class="brand-header">
          <div class="brand-logo-wrap">
            <img src="assets/logo.png" alt="MployChek" class="brand-logo-img" />
          </div>
          <p class="brand-tagline">Login Page Demo</p>
        </div>

        <!-- Server Error Banner -->
        <div class="error-banner" *ngIf="serverError">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ serverError }}</span>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
          <!-- User ID -->
          <div class="form-group">
            <label for="userId">User ID</label>
            <div class="input-with-icon">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input
                id="userId"
                type="text"
                class="form-control"
                formControlName="userId"
                placeholder="Enter your user ID"
                autocomplete="username"
              />
            </div>
            <span
              class="error-hint"
              *ngIf="userIdControl?.touched && userIdControl?.hasError('required')"
            >
              User ID is required.
            </span>
            <span
              class="error-hint"
              *ngIf="userIdControl?.touched && userIdControl?.hasError('minlength')"
            >
              Must be at least 3 characters.
            </span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                formControlName="password"
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="password-toggle-btn"
                (click)="togglePasswordVisibility()"
                aria-label="Toggle password visibility"
              >
                <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span
              class="error-hint"
              *ngIf="passwordControl?.touched && passwordControl?.hasError('required')"
            >
              Password is required.
            </span>
            <span
              class="error-hint"
              *ngIf="passwordControl?.touched && passwordControl?.hasError('minlength')"
            >
              Must be at least 6 characters.
            </span>
          </div>

          <!-- Role Box Selector -->
          <div class="form-group">
            <label>Role</label>
            <div class="role-box">
              <button
                type="button"
                class="role-box-btn"
                [class.active]="loginForm.get('role')?.value === 'General User'"
                (click)="selectRole('General User')"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>General User</span>
              </button>
              <button
                type="button"
                class="role-box-btn"
                [class.active]="loginForm.get('role')?.value === 'Admin' || loginForm.get('role')?.value === 'Administrator'"
                (click)="selectRole('Admin')"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <span>Admin</span>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="btn btn-primary btn-submit"
            [disabled]="isSubmitting"
          >
            <span *ngIf="!isSubmitting">Sign In to MployChek</span>
            <span *ngIf="isSubmitting" class="spinner-label">
              <span class="btn-spinner"></span>
              Authenticating...
            </span>
          </button>
        </form>

        <!-- Footer -->
        <div class="form-footer">
          <span class="footer-text">Secured with JWT & bcrypt encryption</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Hero Panel -->
    <div class="hero-panel">
      <div class="hero-content">
        <!-- Floating decorative elements -->
        <div class="hero-float-shapes">
          <div class="float-circle circle-1"></div>
          <div class="float-circle circle-2"></div>
          <div class="float-circle circle-3"></div>
        </div>

        <!-- Central Isometric Security Illustration -->
        <div class="hero-illustration">
          <svg class="isometric-graphic" viewBox="0 0 380 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#312e81" />
                <stop offset="100%" stop-color="#1e1b4b" />
              </linearGradient>
              <linearGradient id="serverFront" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4338ca" />
                <stop offset="100%" stop-color="#3730a3" />
              </linearGradient>
              <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e0e7ff" />
                <stop offset="100%" stop-color="#c7d2fe" />
              </linearGradient>
              <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#2563eb" />
              </linearGradient>
              <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4f46e5" />
                <stop offset="100%" stop-color="#312e81" />
              </linearGradient>
              <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- Isometric Grid Base Platform Glow -->
            <ellipse cx="190" cy="225" rx="140" ry="50" fill="rgba(255, 255, 255, 0.08)" filter="url(#glowFilter)" />
            <polygon points="190,170 310,230 190,290 70,230" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
            <polygon points="190,185 285,232 190,280 95,232" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="3 3" />

            <!-- Left Database Cylinders -->
            <g class="anim-float-subtle" transform="translate(60, 110)">
              <!-- Bottom Cylinder -->
              <path d="M20,60 C20,50 60,50 60,60 L60,78 C60,88 20,88 20,78 Z" fill="url(#dbGrad)" opacity="0.9" />
              <ellipse cx="40" cy="60" rx="20" ry="8" fill="#ffffff" />
              <!-- Middle Cylinder -->
              <path d="M20,44 C20,34 60,34 60,44 L60,60 C60,70 20,70 20,60 Z" fill="url(#dbGrad)" opacity="0.9" />
              <ellipse cx="40" cy="44" rx="20" ry="8" fill="#ffffff" />
              <!-- Top Cylinder -->
              <path d="M20,28 C20,18 60,18 60,28 L60,44 C60,54 20,54 20,44 Z" fill="url(#dbGrad)" />
              <ellipse cx="40" cy="28" rx="20" ry="8" fill="#ffffff" />
              <!-- Light stripe -->
              <line x1="28" y1="36" x2="36" y2="36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
              <line x1="28" y1="52" x2="36" y2="52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
              <line x1="28" y1="68" x2="36" y2="68" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
            </g>

            <!-- Main Isometric Server Tower -->
            <g transform="translate(145, 60)">
              <!-- Server Top -->
              <polygon points="45,0 90,22 45,45 0,22" fill="#4338ca" />
              <!-- Server Left Side -->
              <polygon points="0,22 45,45 45,175 0,152" fill="url(#serverGrad)" />
              <!-- Server Right Side (Front with drives) -->
              <polygon points="45,45 90,22 90,152 45,175" fill="url(#serverFront)" />

              <!-- Server Rack Drive Bays / Slots (Isometric slant) -->
              <g stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2">
                <line x1="48" y1="58" x2="86" y2="38" />
                <line x1="48" y1="76" x2="86" y2="56" />
                <line x1="48" y1="94" x2="86" y2="74" />
                <line x1="48" y1="112" x2="86" y2="92" />
                <line x1="48" y1="130" x2="86" y2="110" />
                <line x1="48" y1="148" x2="86" y2="128" />
              </g>

              <!-- Blinking Status LEDs -->
              <circle cx="53" cy="54" r="2.5" fill="#38bdf8" />
              <circle cx="53" cy="72" r="2.5" fill="#10b981" />
              <circle cx="53" cy="90" r="2.5" fill="#38bdf8" />
              <circle cx="53" cy="108" r="2.5" fill="#10b981" />
              <circle cx="53" cy="126" r="2.5" fill="#f59e0b" />
              <circle cx="53" cy="144" r="2.5" fill="#10b981" />

              <circle cx="61" cy="50" r="1.5" fill="#ffffff" opacity="0.8" />
              <circle cx="61" cy="68" r="1.5" fill="#ffffff" opacity="0.8" />
              <circle cx="61" cy="86" r="1.5" fill="#ffffff" opacity="0.8" />

              <!-- Floating Lock on Server -->
              <g transform="translate(68, 75)" filter="url(#glowFilter)">
                <rect x="-14" y="-5" width="28" height="24" rx="5" fill="#ffffff" />
                <path d="M-8,-5 V-12 C-8,-17 8,-17 8,-12 V-5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
                <circle cx="0" cy="5" r="3" fill="#4338ca" />
                <path d="M0,7 L0,12" stroke="#4338ca" stroke-width="2" stroke-linecap="round" />
              </g>
            </g>

            <!-- Floating Shield at Upper Left of Server -->
            <g class="anim-float-shield" transform="translate(130, 40)">
              <ellipse cx="25" cy="30" rx="30" ry="30" fill="rgba(56, 189, 248, 0.3)" filter="url(#glowFilter)" />
              <path d="M25,8 L44,16 C44,32 35,46 25,52 C15,46 6,32 6,16 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2" />
              <!-- Checkmark on Shield -->
              <path d="M17,29 L23,35 L33,23" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            </g>

            <!-- Right Database Cylinders Stack -->
            <g class="anim-float-subtle-rev" transform="translate(255, 140)">
              <!-- Bottom Cylinder -->
              <path d="M15,50 C15,42 55,42 55,50 L55,66 C55,74 15,74 15,66 Z" fill="url(#dbGrad)" opacity="0.85" />
              <ellipse cx="35" cy="50" rx="20" ry="7" fill="#ffffff" />
              <!-- Top Cylinder -->
              <path d="M15,35 C15,27 55,27 55,35 L55,50 C55,58 15,58 15,50 Z" fill="url(#dbGrad)" />
              <ellipse cx="35" cy="35" rx="20" ry="7" fill="#ffffff" />
              <line x1="24" y1="42" x2="32" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
              <line x1="24" y1="57" x2="32" y2="57" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
            </g>

            <!-- Isometric Smartphone / Terminal on Floor -->
            <g transform="translate(100, 195)">
              <polygon points="35,0 75,16 40,32 0,16" fill="url(#phoneGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
              <!-- Screen graphic -->
              <polygon points="33,4 67,17 38,29 5,16" fill="#1e1b4b" />
              <circle cx="36" cy="16" r="4" fill="#38bdf8" />
              <line x1="25" y1="21" x2="47" y2="21" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
            </g>

            <!-- Isometric Key on Desk -->
            <g transform="translate(170, 205)" class="anim-float-subtle">
              <circle cx="10" cy="10" r="7" fill="none" stroke="#fbbf24" stroke-width="3" />
              <line x1="15" y1="14" x2="32" y2="28" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
              <line x1="26" y1="23" x2="29" y2="20" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
              <line x1="30" y1="26" x2="33" y2="23" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
            </g>

            <!-- Floating Status Chips -->
            <!-- Top Right: Verified Identity -->
            <g transform="translate(265, 45)" class="anim-float-card-1">
              <rect x="0" y="0" width="105" height="34" rx="17" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1" />
              <circle cx="17" cy="17" r="9" fill="#10b981" />
              <path d="M13,17 L16,20 L21,14" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              <text x="32" y="21" fill="#ffffff" font-size="11" font-weight="600" font-family="'Outfit', sans-serif">Verified</text>
            </g>

            <!-- Left: 256-Bit SSL -->
            <g transform="translate(10, 80)" class="anim-float-card-2">
              <rect x="0" y="0" width="112" height="34" rx="17" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1" />
              <circle cx="17" cy="17" r="9" fill="#38bdf8" />
              <!-- Lock icon in chip -->
              <rect x="13" y="15" width="8" height="6" rx="1" fill="#ffffff" />
              <path d="M15,15 V13 C15,11.5 19,11.5 19,13 V15" fill="none" stroke="#ffffff" stroke-width="1.2" />
              <text x="32" y="21" fill="#ffffff" font-size="11" font-weight="600" font-family="'Outfit', sans-serif">256-Bit SSL</text>
            </g>
          </svg>
        </div>

        <h2 class="hero-title">Secure Authentication</h2>
        <p class="hero-desc">
          Your security is our priority. We use industry-standard
          encryption to protect your data.
        </p>


      </div>
    </div>

  </div>
</div>
