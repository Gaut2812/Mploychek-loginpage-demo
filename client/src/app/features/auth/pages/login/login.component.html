<div class="login-page">
  <!-- Theme toggle at corner -->
  <button
    type="button"
    class="theme-toggle-btn glass-panel"
    (click)="themeService.toggleTheme()"
    [attr.aria-label]="'Switch to ' + ((themeService.theme$ | async) === 'dark' ? 'light' : 'dark') + ' theme'"
  >
    <svg *ngIf="(themeService.theme$ | async) === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <svg *ngIf="(themeService.theme$ | async) === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <span>{{ (themeService.theme$ | async) === 'dark' ? 'Light' : 'Dark' }}</span>
  </button>

  <div class="login-container">
    <div class="login-card glass-panel">
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1 class="brand-name">MployChek</h1>
        <p class="brand-tagline">Enterprise Identity & Record Governance</p>
      </div>

      <!-- Quick Demo Access Pills -->
      <div class="demo-pills">
        <span class="demo-label">Demo Credentials:</span>
        <div class="pill-buttons">
          <button
            type="button"
            class="pill-btn pill-user"
            (click)="fillDemo('user01', 'User@123', 'general_user')"
          >
            <span class="pill-dot"></span>
            General User (user01)
          </button>
          <button
            type="button"
            class="pill-btn pill-admin"
            (click)="fillDemo('admin01', 'Admin@123', 'admin')"
          >
            <span class="pill-dot"></span>
            Admin (admin01)
          </button>
        </div>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- User ID -->
        <div class="form-group">
          <label for="userId">User ID</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              id="userId"
              type="text"
              class="form-control"
              formControlName="userId"
              placeholder="e.g. user01 or admin01"
              autocomplete="username"
            />
          </div>
          <span
            class="error-hint"
            *ngIf="userIdControl?.touched && userIdControl?.hasError('required')"
          >
            User ID is required.
          </span>
          <span
            class="error-hint"
            *ngIf="userIdControl?.touched && userIdControl?.hasError('minlength')"
          >
            Must be at least 3 characters.
          </span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              formControlName="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()"
              aria-label="Toggle password visibility"
            >
              <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span
            class="error-hint"
            *ngIf="passwordControl?.touched && passwordControl?.hasError('required')"
          >
            Password is required.
          </span>
          <span
            class="error-hint"
            *ngIf="passwordControl?.touched && passwordControl?.hasError('minlength')"
          >
            Must be at least 6 characters.
          </span>
        </div>

        <!-- Role Selector -->
        <div class="form-group">
          <label>Select Role</label>
          <div class="role-selector-grid">
            <label
              class="role-card"
              [class.active]="roleControl?.value === 'general_user'"
            >
              <input
                type="radio"
                formControlName="role"
                value="general_user"
                class="sr-only"
              />
              <div class="role-icon user-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
              <div class="role-info">
                <span class="role-title">General User</span>
                <span class="role-desc">View own personal records</span>
              </div>
            </label>

            <label
              class="role-card"
              [class.active]="roleControl?.value === 'admin'"
            >
              <input
                type="radio"
                formControlName="role"
                value="admin"
                class="sr-only"
              />
              <div class="role-icon admin-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
              </div>
              <div class="role-info">
                <span class="role-title">Admin</span>
                <span class="role-desc">Manage all users & records</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary btn-submit"
          [disabled]="isSubmitting"
        >
          <span *ngIf="!isSubmitting">Sign In to MployChek</span>
          <span *ngIf="isSubmitting" class="spinner-label">
            <span class="btn-spinner"></span>
            Authenticating...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
