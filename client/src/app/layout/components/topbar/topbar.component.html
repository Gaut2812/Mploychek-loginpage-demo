<header class="topbar glass-panel">

  <div class="topbar-right" *ngIf="currentUser$ | async as user">

    <!-- User Profile Header Summary -->
    <div class="user-profile-summary">
      <div class="avatar" [ngClass]="user.role === 'Administrator' ? 'avatar-admin' : 'avatar-user'">
        {{ (user.name || user.fullName || user.userId).substring(0, 2).toUpperCase() }}
      </div>
      <div class="user-details">
        <span class="user-name">{{ user.name || user.fullName }}</span>
        <span class="user-role-tag">{{ user.role | roleLabel }}</span>
      </div>
    </div>

    <!-- Logout Button -->
    <button type="button" class="btn btn-secondary btn-sm logout-btn" (click)="onLogout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sign Out</span>
    </button>
  </div>
</header>
