<header class="topbar glass-panel">
  <div class="topbar-left">
    <div class="portal-badge">
      <span class="live-indicator"></span>
      <span>Enterprise System Online</span>
    </div>
  </div>

  <div class="topbar-right" *ngIf="currentUser$ | async as user">
    <!-- Theme Toggle -->
    <button
      type="button"
      class="icon-btn"
      (click)="themeService.toggleTheme()"
      [title]="'Switch to ' + ((themeService.theme$ | async) === 'dark' ? 'Light' : 'Dark') + ' Mode'"
    >
      <svg *ngIf="(themeService.theme$ | async) === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <svg *ngIf="(themeService.theme$ | async) === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <div class="divider"></div>

    <!-- User Profile Header Summary -->
    <div class="user-profile-summary">
      <div class="avatar" [ngClass]="user.role === 'Administrator' ? 'avatar-admin' : 'avatar-user'">
        {{ (user.name || user.fullName || user.userId).substring(0, 2).toUpperCase() }}
      </div>
      <div class="user-details">
        <span class="user-name">{{ user.name || user.fullName }}</span>
        <span class="user-role-tag">{{ user.role | roleLabel }}</span>
      </div>
    </div>

    <!-- Logout Button -->
    <button type="button" class="btn btn-secondary btn-sm logout-btn" (click)="onLogout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sign Out</span>
    </button>
  </div>
</header>
